<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Rotaciones - Edición Manual Avanzada</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2065/2065224.png">

    <style>
        :root { 
            --bg-main: #000000;       
            --bg-card: #111827;       
            --primary: #3b82f6;       
            --primary-light: #22d3ee; 
            --accent: #f59e0b;        
            --text-main: #ffffff;     
            --text-muted: #94a3b8;    
            --success: #10b981; 
            --danger: #f43f5e; 
            --border-color: #1f2937;
        }
        
        * { box-sizing: border-box; }
        html { font-size: 14px; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 12px; 
            margin: 0; 
            padding-bottom: 105px; 
            font-size: 0.85rem; 
        }
        
        .container { 
            max-width: 1200px; 
            margin: auto;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 100px);
        }
        
        .main-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0 12px 0;
        }

        .main-header h1 {
            margin: 0;
            font-size: 1.05rem; 
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
            text-align: center;
            width: 100%;
            max-width: 85%;
        }

        .schedule-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn-schedule {
            background: #111827;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.2s;
            flex: 1;
            max-width: 120px;
            text-align: center;
        }
        .btn-schedule.active-day {
            background: #1e3a8a;
            color: #60a5fa;
            border-color: #3b82f6;
        }
        .btn-schedule.active-afternoon {
            background: #2e1065;
            color: #c084fc;
            border-color: #a855f7;
        }
        .btn-schedule.active-night {
            background: #1e293b;
            color: #38bdf8;
            border-color: #0284c7;
        }

        /* Banner de edición de jornada guardada */
        .edit-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #2a1f08;
            border: 1px solid var(--accent);
            color: #fbbf24;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .edit-banner.active {
            display: flex;
        }
        .btn-cancel-edit {
            background: #451a03;
            color: #fde68a;
            border: 1px solid #b45309;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Panel de bajas y rebalanceo */
        .baja-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .baja-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .baja-label {
            font-weight: 800;
            color: #fda4af;
            font-size: 0.78rem;
            white-space: nowrap;
        }
        .baja-select {
            background: #050505;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.78rem;
            font-weight: 700;
            flex: 1;
            min-width: 95px;
            outline: none;
        }
        .btn-rebalance {
            background: #7f1d1d;
            color: #fecdd3;
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .baja-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .baja-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #271c1c;
            border: 1px solid #9f1239;
            color: #fda4af;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 700;
        }
        .baja-chip button {
            background: transparent;
            border: none;
            color: #ffffff;
            font-weight: 900;
            cursor: pointer;
            padding: 0 2px;
            font-size: 0.8rem;
        }

        .tabs-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; right: 0; 
            background: #0a0a0a; 
            display: flex; 
            justify-content: space-around;
            padding: 8px 4px; 
            border-top: 1px solid #222;
            z-index: 9999;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }
        
        .tab-btn { 
            flex: 1; 
            border: none; 
            background: transparent; 
            color: var(--text-muted); 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            font-size: 0.62rem;
            font-weight: 700;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .tab-btn .icon { font-size: 1.45rem !important; } 
        .tab-btn.active { color: var(--primary-light); transform: scale(1.05); }

        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex-grow: 1; }

        .config-grid { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            overflow-y: hidden; 
            scroll-behavior: smooth; 
            scroll-snap-type: x mandatory;
            padding: 5px 5px 15px 5px;
            -webkit-overflow-scrolling: touch;
            flex-grow: 1;
            touch-action: pan-x; 
        }
        .config-grid::-webkit-scrollbar { display: none; }

        .section-box { 
            background: var(--bg-card); border-radius: 12px; padding: 14px; border: 1px solid var(--border-color);
            flex: 0 0 calc(100% - 10px); scroll-snap-align: center;   
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-weight: 800; color: var(--primary-light); font-size: 0.95rem; }
        .btn-add { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .item-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex-grow: 1;
            overflow-y: auto; 
            max-height: calc(100vh - 270px); 
            padding-right: 4px; 
        }
        .item-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        
        #listaOps .item-input, #listaCargas .item-input { 
            flex: 1; 
            padding: 10px 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 0.9rem; 
            background: #000; 
            font-weight: 800; 
            cursor: pointer;
            -webkit-user-select: none; 
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }
        #listaOps .item-input { color: var(--primary-light); }
        #listaCargas .item-input { color: #fff; }

        .btn-edit-text { 
            background: #1f2937; 
            color: #a5f3fc; 
            border: 1px solid #0891b2; 
            padding: 0; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 36px; 
            height: 36px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.9rem; 
            flex-shrink: 0; 
        }

        .item-input:focus { border-color: var(--primary-light); outline: none; }
        .btn-del { background: #2a1f08; color: var(--accent); border: 1px solid #78350f; padding: 0; border-radius: 50%; cursor: pointer; font-weight: bold; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }

        .matrix-container { 
            overflow-x: auto; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 12px;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }

        .matrix-table { 
            width: max-content; 
            min-width: 100%;
            border-collapse: collapse; 
            table-layout: fixed; 
        }

        .matrix-table tr { height: 46px !important; max-height: 46px !important; }
        
        .matrix-table th { 
            background: #111827; 
            color: var(--text-muted); 
            font-size: 0.68rem; 
            padding: 4px 6px; 
            height: 46px;
            border: 1px solid var(--border-color); 
            font-weight: 800; 
            text-transform: uppercase; 
            text-align: center;
            white-space: normal !important; 
            word-break: break-word;
            line-height: 1.1;
            display: table-cell;
            vertical-align: middle;
            width: 150px !important; 
            min-width: 150px !important;
            max-width: 150px !important;
            box-sizing: border-box;
        }

        .matrix-table th:first-child,
        .matrix-table td:first-child {
            width: 120px !important;
            min-width: 120px !important;
            max-width: 120px !important;
            height: 46px !important;
            max-height: 46px !important;
            text-align: left; 
            font-weight: 700; 
            background: #050505 !important; 
            color: var(--primary-light); 
            position: sticky; 
            left: 0; 
            z-index: 10; 
            border-right: 2px solid var(--border-color);
            padding-left: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: table-cell; 
            vertical-align: middle;
            font-size: 0.8rem;
        }

        .matrix-table td { 
            padding: 0 8px; 
            text-align: center; 
            border: 1px solid var(--border-color); 
            font-size: 0.85rem; 
            color: #ffffff;
            white-space: nowrap;
            box-sizing: border-box;
            height: 46px !important;
            max-height: 46px !important;
            width: 150px;
            min-width: 150px;
            max-width: 150px;
            display: table-cell;
            vertical-align: middle;
        }
        
        .count-number { 
            font-weight: 900; 
            color: var(--accent) !important; 
            font-size: 1rem !important; 
            text-align: center;
            display: inline-block;
            width: 100%;
        }

        .matrix-table input[type="checkbox"] { 
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: #1f2937; 
            margin: 0 auto !important; 
            display: block !important;
            width: 22px !important;  
            height: 22px !important; 
            min-width: 22px !important; 
            min-height: 22px !important;
            max-width: 22px !important;
            max-height: 22px !important;
            border: 2px solid var(--border-color) !important; 
            border-radius: 6px !important; 
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }

        .matrix-table input[type="checkbox"]:checked {
            background-color: var(--primary-light) !important; 
            border-color: var(--primary-light) !important;
        }

        .matrix-table input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 6px;
            top: 1px;
            width: 4px;
            height: 9px;
            border: solid #000000; 
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .action-bar { display: flex; gap: 8px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn-main { border: none; padding: 10px 16px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: all 0.2s; justify-content: center; }
        .btn-primary { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }
        .btn-secondary { background: #334155; color: white; border: 1px solid #475569; }
        .btn-success { background: #065f46; color: #34d399; border: 1px solid #059669; }
        .btn-update { background: #78350f; color: #fde68a; border: 1px solid #f59e0b; }

        .jornada-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto;       
            overflow-x: hidden;     
            padding: 5px 5px 80px 5px; 
            max-height: calc(100vh - 260px); 
            -webkit-overflow-scrolling: touch;
        }

        .turno-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            overflow: hidden; 
            flex: 0 0 auto; 
            width: 100%;    
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .jornada-grid { 
                display: grid; 
                grid-template-columns: repeat(4, 1fr); 
                overflow-y: visible;
                max-height: none;
            }
        }

        .turno-header { background: #050505; color: var(--accent); padding: 10px; text-align: center; font-weight: 800; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); letter-spacing: 0.5px; }
        .turno-header span { color: #ffffff; display: block; font-size: 0.75rem; margin-top: 2px; font-weight: 600; opacity: 0.8; }
        
        .results-table { width: 100%; border-collapse: collapse; }
        .results-table td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        
        .carga-title { font-weight: 800; color: #ffffff; font-size: 0.9rem; letter-spacing: -0.3px; }
        
        .select-op-editable {
            background: transparent; color: var(--primary-light); border: none; font-weight: 800; font-size: 0.9rem;
            width: 100%; cursor: pointer; outline: none; font-family: inherit; text-transform: uppercase;
            -webkit-appearance: none; appearance: none;
        }
        .select-op-editable option { background: #111827; color: #fff; }
        .select-op-editable.op-alert { color: var(--accent); }
        .select-op-editable.op-error { color: var(--danger); }

        .turno-libres { 
            padding: 8px 10px; 
            background: #0f172a; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            border-top: 1px solid var(--border-color); 
        }
        .turno-libres strong { color: #cbd5e1; }
        .turno-bajas {
            padding: 6px 10px;
            background: #271c1c;
            font-size: 0.75rem;
            color: #fda4af;
            border-top: 1px solid #4c0519;
        }

        .tarjeta-resumen { 
            background: #050505; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .tarjeta-resumen-header { 
            font-weight: 800; 
            color: var(--primary-light); 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 4px; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
        }
        .tarjeta-resumen-fila { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.78rem; 
        }
        .tarjeta-resumen-turno { color: var(--accent); font-weight: bold; }
        .tarjeta-resumen-puesto { color: #ffffff; font-weight: 700; }
        .tarjeta-resumen-vacio { color: var(--text-muted); font-weight: normal; }

        .history-header { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 15px; 
            gap: 10px; 
            width: 100%;
        }
        .history-header .section-title { font-size: 0.88rem; white-space: nowrap; font-weight: 800; }
        .btn-counter-reset {
            background: #2a1f08; 
            color: var(--accent); 
            border: 1px solid #78350f; 
            padding: 6px 10px; 
            font-size: 0.78rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0; 
        }

        .btn-clear-hist { background: #271c1c; color: var(--danger); border: 1px solid #7f1d1d; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .history-list { display: flex; flex-direction: column; gap: 15px; max-height: 70vh; overflow-y: auto; }
        .history-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; }
        .history-item-title { font-weight: 800; color: var(--accent); margin-bottom: 8px; font-size: 0.85rem; border-bottom: 1px solid #1f2937; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .history-item-content { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: 0.8rem; }
        @media (min-width: 600px) { .history-item-content { grid-template-columns: repeat(4, 1fr); } }
        .history-turno-block { background: #000; padding: 6px; border-radius: 6px; border: 1px solid #1f2937; }
        .history-turno-title { font-weight: 800; color: var(--primary-light); font-size: 0.75rem; margin-bottom: 4px; }
        .history-linea { font-size: 0.75rem; color: #ccc; margin-bottom: 2px; }
        .history-linea strong { color: #fff; }

        .toast {
            position: fixed; 
            bottom: 80px; 
            left: 50%; 
            transform: translateX(-50%);
            background: #065f46; 
            color: #34d399; 
            padding: 12px 24px;
            border: 1px solid #059669;
            border-radius: 8px; 
            font-weight: bold; 
            opacity: 0; 
            pointer-events: none;
            transition: opacity 0.3s ease-in-out; 
            z-index: 10000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1>Control de Rotaciones</h1>
    </div>

    <div id="tab-config" class="tab-content active">
        <div class="section-box" style="margin-bottom: 12px; padding: 12px 14px; flex: 0 0 auto; display: block !important;">
            <div class="section-header" style="margin-bottom: 8px;">
                <span class="section-title">💾 Copias de Seguridad</span>
            </div>
            <div style="display: flex; gap: 10px; width: 100%;">
                <button class="btn-main btn-secondary" style="flex: 1; padding: 10px; font-size: 0.85rem;" onclick="exportarDatos()">📥 Exportar JSON</button>
                <label class="btn-main btn-primary" style="flex: 1; padding: 10px; font-size: 0.85rem; margin: 0; cursor: pointer; text-align: center;">
                    📤 Importar JSON
                    <input type="file" id="fileImport" accept=".json" style="display: none;" onchange="importarDatos(event)">
                </label>
            </div>
        </div>

        <div class="config-grid" id="contenedorConfig">
            <div class="section-box">
                <div class="section-header">
                    <span class="section-title">👷 Operarios en turno</span>
                    <button class="btn-add" onclick="agregarFila('listaOps', 'Operario')">+ Añadir</button>
                </div>
                <div id="listaOps" class="item-list"></div>
            </div>
            <div class="section-box">
                <div class="section-header">
                    <span class="section-title">📦 Cargas de Trabajo</span>
                    <button class="btn-add" onclick="agregarFila('listaCargas', 'Carga')">+ Añadir</button>
                </div>
                <div id="listaCargas" class="item-list"></div>
            </div>
        </div>
    </div>

    <div id="tab-matriz" class="tab-content">
        <div class="matrix-container" id="contenedorMatriz"></div>
    </div>

    <div id="tab-jornada" class="tab-content">
        <div id="bannerEdicion" class="edit-banner">
            <span id="textoBannerEdicion">✏️ Editando jornada guardada</span>
            <button class="btn-cancel-edit" onclick="cancelarEdicionJornada()">✖ Cancelar</button>
        </div>

        <div class="schedule-selector">
            <button id="btnHorarioManana" class="btn-schedule active-day" onclick="seleccionarTipoHorario('manana')">☀️ Mañana</button>
            <button id="btnHorarioTarde" class="btn-schedule" onclick="seleccionarTipoHorario('tarde')">🌙 Tarde</button>
            <button id="btnHorarioNoche" class="btn-schedule" onclick="seleccionarTipoHorario('noche')">🌑 Noche</button>
        </div>

        <div class="baja-panel">
            <div class="baja-controls">
                <span class="baja-label">🤒 Baja:</span>
                <select id="selectOpBaja" class="baja-select"></select>
                <select id="selectTurnoBaja" class="baja-select">
                    <option value="1">Desde Turno 1</option>
                    <option value="2" selected>Desde Turno 2</option>
                    <option value="3">Desde Turno 3</option>
                    <option value="4">Desde Turno 4</option>
                </select>
                <button class="btn-rebalance" onclick="aplicarBajaYRebalancear()">⚡ Rebalancear</button>
            </div>
            <div id="listaBajasActivas" class="baja-chips" style="display: none;"></div>
        </div>

        <div class="jornada-grid" id="contenedorJornada"></div>

        <div class="action-bar">
            <button class="btn-main btn-primary" onclick="cambiarCombinacion()">🔄 Combinación</button>
            <button id="btnGuardarJornada" class="btn-main btn-success" onclick="guardarEnHistorial()">💾 Guardar Hoy</button>
            <button class="btn-main btn-secondary" onclick="imprimirJornadaActual()">📄 Compartir / PDF</button>
        </div>
    </div>

    <div id="tab-resumen" class="tab-content">
        <div class="section-box" style="flex: 1 0 auto;">
            <div class="section-header">
                <span class="section-title">📋 Resumen Individual por Operario</span>
            </div>
            <div id="contenedorResumenOperarios" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding-top: 5px;"></div>
        </div>
    </div>

    <div id="tab-contador" class="tab-content">
        <div class="history-header">
            <span class="section-title">📊 Veces por Puesto</span>
            <button class="btn-counter-reset" onclick="reiniciarContadoresSemanales()">🔄 Nueva Semana</button>
        </div>
        <div class="matrix-container" id="contenedorContador"></div>
    </div>

    <div id="tab-historial" class="tab-content">
        <div class="history-header">
            <span class="section-title">📂 Historial de Jornadas</span>
            <button class="btn-clear-hist" onclick="borrarTodoElHistorial()">🗑️ Vaciar Todo</button>
        </div>
        <div id="contenedorHistorial" class="history-list"></div>
    </div>

    <div class="tabs-nav">
        <button class="tab-btn active" onclick="cambiarPestaña('tab-config', this)">
            <span class="icon">⚙️</span>
            <span>Configurar</span>
        </button>
        <button class="tab-btn" onclick="cambiarPestaña('tab-matriz', this)">
            <span class="icon">🛠️</span>
            <span>Polivalencia</span>
        </button>
        <button class="tab-btn" onclick="cambiarPestaña('tab-jornada', this)">
            <span class="icon">📅</span>
            <span>Turnos</span>
        </button>
        <button class="tab-btn" onclick="cambiarPestaña('tab-resumen', this)">
            <span class="icon">📋</span>
            <span>Resumen</span>
        </button>
        <button class="tab-btn" onclick="cambiarPestaña('tab-contador', this)">
            <span class="icon">📊</span>
            <span>Contador</span>
        </button>
        <button class="tab-btn" onclick="cambiarPestaña('tab-historial', this)">
            <span class="icon">📂</span>
            <span>Historial</span>
        </button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fallo: ', err));
        });
    }

    let saltoInicialJornada = 0;
    let competencies = {};
    let historialJornadas = [];
    let conteoSemanal = {}; 
    let tipoHorarioSeleccionado = "manana"; 
    let cambiosManualesUsuarios = {}; 
    let matrizJornadaCalculada = {}; 

    // Variables para edición de jornada guardada y bajas en turno
    let editandoJornadaId = null;
    let plantillaEditada = null;
    let turnoRebalanceoMinimo = 5;
    let bajasPorTurno = { 1: [], 2: [], 3: [], 4: [] };

    const horasMañana = ["05:45 - 08:00", "08:00 - 10:20", "10:20 - 12:00", "12:00 - 14:00"];
    const horasTarde = ["13:45 - 16:20", "16:20 - 18:00", "18:00 - 20:00", "20:00 - 22:00"];
    const horasNoche = ["21:45 - 00:00", "00:00 - 02:20", "02:20 - 04:00", "04:00 - 06:00"];

    const defaultOps = ["ADRI", "YLENIA", "ANDRÉS", "FRANCO", "Óscar"];
    const defaultCargas = [
        "Montante A Inf Izq", 
        "Montante A Inf Der", 
        "Montaje Batería", 
        "Manguitos", 
        "Bandeja batería", 
        "Listón", 
        "Acon. Conexiones", 
        "Manipulador Alfombra", 
        "Masa Convertidor"
    ];

    function cargarDatosLocales(key, valorPorDefecto) {
        let data = localStorage.getItem(key);
        
        if (!data) {
            let base = key.replace('_v14', '');
            data = localStorage.getItem(base + '_v13') || 
                   localStorage.getItem(base + '_v12') || 
                   localStorage.getItem(base);
            
            if (data) {
                localStorage.setItem(key, data);
            }
        }

        if (!data) return valorPorDefecto;
        try {
            let parsed = JSON.parse(data);
            if (typeof parsed === 'string') {
                try { parsed = JSON.parse(parsed); } catch(e){}
            }
            return (parsed !== null && parsed !== undefined) ? parsed : valorPorDefecto;
        } catch (e) {
            return valorPorDefecto;
        }
    }

    function mostrarToast(mensaje) {
        const toast = document.getElementById("toast");
        toast.textContent = mensaje;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    window.onload = function() {
        competencies = cargarDatosLocales('hist_competencias_v14', {});
        historialJornadas = cargarDatosLocales('registro_jornadas_v14', []);
        conteoSemanal = cargarDatosLocales('conteo_semanal_v14', {});
        
        tipoHorarioSeleccionado = localStorage.getItem('tipo_horario_v14') || "manana";

        let ops = cargarDatosLocales('hist_ops_v14', defaultOps);
        let cargas = cargarDatosLocales('hist_cargas_v14', defaultCargas);

        if (!Array.isArray(ops) || ops.length === 0) ops = [...defaultOps];
        if (!Array.isArray(cargas) || cargas.length === 0) cargas = [...defaultCargas];

        let conjuntoCargas = new Set(cargas);

        if (typeof competencies === 'object' && competencies !== null) {
            Object.keys(competencies).forEach(key => {
                let partes = key.split('_X_');
                if (partes.length === 2 && partes[1] && partes[1].trim() !== '') {
                    conjuntoCargas.add(partes[1].trim());
                }
            });
        }

        if (Array.isArray(historialJornadas)) {
            historialJornadas.forEach(j => {
                if (j && j.datos) {
                    for (let t in j.datos) {
                        if (j.datos[t]) {
                            Object.keys(j.datos[t]).forEach(c => {
                                if (c && c.trim() !== '') conjuntoCargas.add(c.trim());
                            });
                        }
                    }
                }
            });
        }

        cargas = Array.from(conjuntoCargas);

        const contOps = document.getElementById('listaOps');
        const contCargas = document.getElementById('listaCargas');
        if (contOps) contOps.innerHTML = "";
        if (contCargas) contCargas.innerHTML = "";

        ops.forEach(v => agregarFila('listaOps', 'Operario', v));
        cargas.forEach(v => agregarFila('listaCargas', 'Carga', v));

        actualizarVisualBotonesHorario();
        procesarCambios();
    };

    function exportarDatos() {
        const data = {
            competencias: cargarDatosLocales('hist_competencias_v14', {}),
            jornadas: cargarDatosLocales('registro_jornadas_v14', []),
            conteo: cargarDatosLocales('conteo_semanal_v14', {}),
            ops: cargarDatosLocales('hist_ops_v14', []),
            cargas: cargarDatosLocales('hist_cargas_v14', [])
        };
        const strData = JSON.stringify(data, null, 2);
        const blob = new Blob([strData], { type: "application/json" });
        const nombreArchivo = `Rotaciones_Backup_${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.json`;

        if (navigator.share && window.File) {
            try {
                const file = new File([blob], nombreArchivo, { type: 'application/json' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({ files: [file], title: 'Copia de Seguridad Rotaciones' });
                    return;
                }
            } catch(e) {}
        }
        compartirTextoNativo(strData, nombreArchivo);
    }

    function importarDatos(evento) {
        const file = evento.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                const guardarLimpio = (clave, valor) => {
                    if (valor !== undefined && valor !== null) {
                        if (typeof valor === 'string') localStorage.setItem(clave, valor);
                        else localStorage.setItem(clave, JSON.stringify(valor));
                    }
                };
                guardarLimpio('hist_competencias_v14', data.competencias);
                guardarLimpio('registro_jornadas_v14', data.jornadas);
                guardarLimpio('conteo_semanal_v14', data.conteo);
                guardarLimpio('hist_ops_v14', data.ops);
                guardarLimpio('hist_cargas_v14', data.cargas);
                
                alert("✅ Copia de seguridad importada correctamente.");
                location.reload();
            } catch(err) {
                alert("❌ El archivo JSON no tiene un formato válido.");
            }
        };
        reader.readAsText(file);
    }

    function cambiarPestaña(tabId, boton) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (boton) boton.classList.add('active');

        if (tabId === 'tab-jornada') generarJornadaCompleta();
        else if (tabId === 'tab-matriz') procesarCambios();
        else if (tabId === 'tab-resumen') actualizarResumenIndividual();
        else if (tabId === 'tab-contador') renderizarTablaContadores();
        else if (tabId === 'tab-historial') renderizarHistorial();
    }

    function seleccionarTipoHorario(tipo) {
        tipoHorarioSeleccionado = tipo;
        localStorage.setItem('tipo_horario_v14', tipo);
        if (!editandoJornadaId) {
            cambiosManualesUsuarios = {}; 
        }
        actualizarVisualBotonesHorario();
        generarJornadaCompleta();
    }

    function actualizarVisualBotonesHorario() {
        const btnM = document.getElementById("btnHorarioManana");
        const btnT = document.getElementById("btnHorarioTarde");
        const btnN = document.getElementById("btnHorarioNoche");
        if (!btnM || !btnT || !btnN) return;
        
        btnM.className = "btn-schedule";
        btnT.className = "btn-schedule";
        btnN.className = "btn-schedule";

        if(tipoHorarioSeleccionado === "manana") btnM.classList.add("active-day");
        else if(tipoHorarioSeleccionado === "tarde") btnT.classList.add("active-afternoon");
        else if(tipoHorarioSeleccionado === "noche") btnN.classList.add("active-night");
    }

    function agregarFila(contenedorId, tipo, valor = "") {
        const contenedor = document.getElementById(contenedorId);
        if (!contenedor) return;
        const row = document.createElement("div");
        row.className = "item-row";
        let valorEscapado = String(valor).replace(/"/g, '&quot;');
        row.innerHTML = `
            <input type="text" class="item-input" value="${valorEscapado}" placeholder="Escribir..." oninput="procesarCambios()" onclick="rotarFilaHaciaArriba(this)" readonly>
            <button class="btn-edit-text" onclick="habilitarEdicionInput(this)">✏️</button>
            <button class="btn-del" onclick="eliminarItem(this)">🗑️</button>
        `;
        contenedor.appendChild(row);
    }

    function eliminarItem(botonDOM) {
        const row = botonDOM.parentElement;
        const input = row.querySelector('.item-input');
        const valorBorrado = input ? input.value.trim() : "";
        row.remove();
        if (valorBorrado !== "") {
            Object.keys(competencies).forEach(key => {
                if(key.startsWith(`${valorBorrado}_X_`) || key.endsWith(`_X_${valorBorrado}`)) delete competencies[key];
            });
            Object.keys(conteoSemanal).forEach(key => {
                if(key.startsWith(`${valorBorrado}_X_`) || key.endsWith(`_X_${valorBorrado}`)) delete conteoSemanal[key];
            });
            localStorage.setItem('hist_competencias_v14', JSON.stringify(competencies));
            localStorage.setItem('conteo_semanal_v14', JSON.stringify(conteoSemanal));
        }
        procesarCambios();
    }

    function habilitarEdicionInput(boton) {
        const input = boton.parentElement.querySelector('.item-input');
        input.removeAttribute('readonly');
        input.focus();
        input.onblur = function() {
            input.setAttribute('readonly', true);
            procesarCambios();
        };
    }

    function leerLista(contenedorId) {
        return Array.from(document.querySelectorAll(`#${contenedorId} .item-input`))
            .map(i => i.value.trim())
            .filter(v => v);
    }

    function procesarCambios() {
        const ops = leerLista("listaOps");
        const cargas = leerLista("listaCargas");
        const contenedorMatriz = document.getElementById("contenedorMatriz");

        localStorage.setItem('hist_ops_v14', JSON.stringify(ops));
        localStorage.setItem('hist_cargas_v14', JSON.stringify(cargas));

        if(!contenedorMatriz) return;
        if(ops.length === 0 || cargas.length === 0) {
            contenedorMatriz.innerHTML = "";
            document.getElementById("contenedorJornada").innerHTML = "";
            return;
        }

        let html = `<table class="matrix-table"><thead><tr><th>Operario</th>`;
        cargas.forEach(c => html += `<th>${c}</th>`);
        html += `</tr></thead><tbody>`;

        ops.forEach(op => {
            html += `<tr><td>${op}</td>`;
            cargas.forEach(c => {
                let clv = `${op}_X_${c}`;
                let check = (competencies[clv] !== false) ? "checked" : "";
                html += `<td><input type="checkbox" data-clave="${clv}" ${check} onchange="competencies[this.dataset.clave]=this.checked; localStorage.setItem('hist_competencias_v14', JSON.stringify(competencies)); generarJornadaCompleta();"></td>`;
            });
            html += `</tr>`;
        });
        html += `</tbody></table>`;
        contenedorMatriz.innerHTML = html;

        if (!editandoJornadaId) {
            cambiosManualesUsuarios = {};
        }
        generarJornadaCompleta();
        renderizarTablaContadores();
    }

    function cambiarCombinacion() {
        saltoInicialJornada++;
        cambiosManualesUsuarios = {}; 
        if (editandoJornadaId && turnoRebalanceoMinimo > 4) {
            turnoRebalanceoMinimo = 1;
        }
        generarJornadaCompleta();
    }

    function contarCargasQueSabe(op, cargas) {
        let aptas = 0;
        cargas.forEach(c => {
            if (competencies[`${op}_X_${c}`] !== false) aptas++;
        });
        return aptas;
    }

    // --- GESTIÓN DE MODO EDICIÓN Y BAJAS EN TURNO ---

    function editarJornadaHistorial(id) {
        const jornada = historialJornadas.find(j => j.id === id);
        if (!jornada) return;

        editandoJornadaId = jornada.id;
        plantillaEditada = JSON.parse(JSON.stringify(jornada.datos || {}));
        turnoRebalanceoMinimo = 5; // Mantiene intactos los 4 turnos guardados hasta que el usuario edite o rebalancee
        cambiosManualesUsuarios = {};
        bajasPorTurno = { 1: [], 2: [], 3: [], 4: [] };

        if (jornada.tipoHorario && jornada.tipoHorario.includes("Tarde")) {
            tipoHorarioSeleccionado = "tarde";
        } else if (jornada.tipoHorario && jornada.tipoHorario.includes("Noche")) {
            tipoHorarioSeleccionado = "noche";
        } else {
            tipoHorarioSeleccionado = "manana";
        }
        actualizarVisualBotonesHorario();

        const btnTabTurnos = document.querySelectorAll('.tab-btn')[2];
        cambiarPestaña('tab-jornada', btnTabTurnos);
        mostrarToast(`✏️ Editando jornada del ${jornada.fecha}`);
    }

    function cancelarEdicionJornada() {
        editandoJornadaId = null;
        plantillaEditada = null;
        turnoRebalanceoMinimo = 5;
        cambiosManualesUsuarios = {};
        bajasPorTurno = { 1: [], 2: [], 3: [], 4: [] };
        generarJornadaCompleta();
        mostrarToast("Edición cancelada");
    }

    function aplicarBajaYRebalancear() {
        const selectOp = document.getElementById("selectOpBaja");
        const selectTurno = document.getElementById("selectTurnoBaja");
        if (!selectOp || !selectTurno) return;

        const opBaja = selectOp.value;
        const desdeTurno = parseInt(selectTurno.value, 10);
        if (!opBaja || isNaN(desdeTurno)) return;

        for (let t = desdeTurno; t <= 4; t++) {
            if (!bajasPorTurno[t].includes(opBaja)) {
                bajasPorTurno[t].push(opBaja);
            }
            // Limpiar asignaciones manuales previas de este operario desde el turno de baja
            Object.keys(cambiosManualesUsuarios).forEach(clave => {
                if (clave.startsWith(`${t}_X_`) && cambiosManualesUsuarios[clave] === opBaja) {
                    delete cambiosManualesUsuarios[clave];
                }
            });
        }

        if (desdeTurno < turnoRebalanceoMinimo) {
            turnoRebalanceoMinimo = desdeTurno;
        }

        generarJornadaCompleta();
        mostrarToast(`⚡ Rebalanceado desde Turno ${desdeTurno} (Baja: ${opBaja})`);
    }

    function quitarBajaOperario(opBaja) {
        for (let t = 1; t <= 4; t++) {
            bajasPorTurno[t] = bajasPorTurno[t].filter(o => o !== opBaja);
        }
        generarJornadaCompleta();
    }

    function actualizarUIModoEdicion(ops) {
        const banner = document.getElementById("bannerEdicion");
        const textoBanner = document.getElementById("textoBannerEdicion");
        const btnGuardar = document.getElementById("btnGuardarJornada");
        const selectOpBaja = document.getElementById("selectOpBaja");
        const contChips = document.getElementById("listaBajasActivas");

        if (banner && textoBanner && btnGuardar) {
            if (editandoJornadaId !== null) {
                const jornada = historialJornadas.find(j => j.id === editandoJornadaId);
                banner.classList.add("active");
                textoBanner.textContent = jornada 
                    ? `✏️ Editando: ${jornada.fecha} (${jornada.tipoHorario})` 
                    : `✏️ Editando jornada guardada`;
                btnGuardar.className = "btn-main btn-update";
                btnGuardar.innerHTML = "💾 Actualizar Jornada";
            } else {
                banner.classList.remove("active");
                btnGuardar.className = "btn-main btn-success";
                btnGuardar.innerHTML = "💾 Guardar Hoy";
            }
        }

        if (selectOpBaja) {
            const valorPrevio = selectOpBaja.value;
            selectOpBaja.innerHTML = ops.map(op => `<option value="${op}">${op}</option>`).join('');
            if (ops.includes(valorPrevio)) selectOpBaja.value = valorPrevio;
        }

        if (contChips) {
            let resumenBajas = {};
            for (let t = 1; t <= 4; t++) {
                (bajasPorTurno[t] || []).forEach(op => {
                    if (!resumenBajas[op]) resumenBajas[op] = t;
                });
            }
            const opsConBaja = Object.keys(resumenBajas);
            if (opsConBaja.length === 0) {
                contChips.style.display = "none";
                contChips.innerHTML = "";
            } else {
                contChips.style.display = "flex";
                contChips.innerHTML = opsConBaja.map(op => {
                    let opEsc = op.replace(/'/g, "\\'");
                    return `<span class="baja-chip">🤒 ${op} (desde T${resumenBajas[op]}) <button onclick="quitarBajaOperario('${opEsc}')" title="Quitar baja">✖</button></span>`;
                }).join('');
            }
        }
    }

    function generarJornadaCompleta() {
        const ops = leerLista("listaOps");
        const cargas = leerLista("listaCargas");
        const contenedor = document.getElementById("contenedorJornada");
        
        if (!contenedor) return;
        if (ops.length === 0 || cargas.length === 0) {
            contenedor.innerHTML = "";
            return;
        }

        localStorage.setItem('hist_ops_v14', JSON.stringify(ops));
        localStorage.setItem('hist_cargas_v14', JSON.stringify(cargas));

        actualizarUIModoEdicion(ops);
        matrizJornadaCalculada = calcularLógicaMatriz(ops, cargas);
        renderizarJornadaHTML(ops, cargas, matrizJornadaCalculada, contenedor);
        actualizarResumenIndividual();
    }

    function calcularLógicaMatriz(ops, cargas) {
        let matrizResultado = {};
        const esAptoGlobal = (op, c) => competencies[`${op}_X_${c}`] !== false;
        const hizoAyerGlobal = (op, c) => { let p = obtenerPuestoAyer(op); return p ? p.has(c) : false; };
        const sabeVarias = (op) => contarCargasQueSabe(op, cargas) > 1;
        
        const yaLaHizoHoy = (candidato, cargaToCheck, turnoActual) => {
            for (let prevT = 1; prevT < turnoActual; prevT++) {
                if (matrizResultado[prevT] && matrizResultado[prevT][cargaToCheck] && matrizResultado[prevT][cargaToCheck].nombre === candidato) return true;
            }
            return false;
        };

        const obtenerConteoAjustado = (op, carga) => {
            let base = parseInt(conteoSemanal[`${op}_X_${carga}`]) || 0;
            if (editandoJornadaId !== null && plantillaEditada) {
                for (let pt = 1; pt <= 4; pt++) {
                    if (plantillaEditada[pt] && plantillaEditada[pt][carga] === op) {
                        base = Math.max(0, base - 1);
                    }
                }
            }
            return base;
        };

        for (let t = 1; t <= 4; t++) {
            matrizResultado[t] = {};
            let manualOps = new Set();
            let manualCargas = new Set();
            let ausentesEnEsteTurno = new Set(bajasPorTurno[t] || []);

            // 1. Cambios manuales realizados por el usuario
            cargas.forEach(carga => {
                let claveManual = `${t}_X_${carga}`;
                if (cambiosManualesUsuarios[claveManual]) {
                    let opManual = cambiosManualesUsuarios[claveManual];
                    if (opManual !== "No Apto") manualOps.add(opManual);
                    manualCargas.add(carga);
                    matrizResultado[t][carga] = { 
                        nombre: opManual, 
                        alerta: (opManual !== "No Apto" && !esAptoGlobal(opManual, carga)),
                        error: (opManual === "No Apto")
                    };
                }
            });

            // 2. Si estamos editando una jornada guardada, conservar intactos los turnos anteriores al rebalanceo
            if (plantillaEditada && t < turnoRebalanceoMinimo) {
                cargas.forEach(carga => {
                    if (!manualCargas.has(carga) && plantillaEditada[t] && plantillaEditada[t][carga] !== undefined) {
                        let opGuardado = plantillaEditada[t][carga];
                        if (opGuardado !== "No Apto" && !ausentesEnEsteTurno.has(opGuardado) && !manualOps.has(opGuardado) && ops.includes(opGuardado)) {
                            manualOps.add(opGuardado);
                            manualCargas.add(carga);
                            matrizResultado[t][carga] = {
                                nombre: opGuardado,
                                alerta: !esAptoGlobal(opGuardado, carga),
                                error: false
                            };
                        } else if (opGuardado === "No Apto") {
                            manualCargas.add(carga);
                            matrizResultado[t][carga] = {
                                nombre: "No Apto",
                                alerta: false,
                                error: true
                            };
                        }
                    }
                });
            }

            let cargasLibres = cargas.filter(c => !manualCargas.has(c));
            let opsLibres = ops.filter(o => !manualOps.has(o) && !ausentesEnEsteTurno.has(o));
            let preferencias = {};

            cargasLibres.forEach((carga) => {
                preferencias[carga] = [...opsLibres].sort((a, b) => {
                    let repiteHoyA = (yaLaHizoHoy(a, carga, t) && sabeVarias(a)) ? 1 : 0;
                    let repiteHoyB = (yaLaHizoHoy(b, carga, t) && sabeVarias(b)) ? 1 : 0;
                    if (repiteHoyA !== repiteHoyB) return repiteHoyA - repiteHoyB;

                    let totalA = 0, totalB = 0;
                    for (let pt = 1; pt < t; pt++) {
                        cargas.forEach(c => {
                            if (matrizResultado[pt] && matrizResultado[pt][c] && matrizResultado[pt][c].nombre === a) totalA++;
                            if (matrizResultado[pt] && matrizResultado[pt][c] && matrizResultado[pt][c].nombre === b) totalB++;
                        });
                    }
                    if (totalA !== totalB) return totalA - totalB;

                    let vecesA = obtenerConteoAjustado(a, carga);
                    let vecesB = obtenerConteoAjustado(b, carga);
                    if (vecesA !== vecesB) return vecesA - vecesB;

                    let idxCarga = cargas.indexOf(carga);
                    let idealIndex = (idxCarga + saltoInicialJornada + (t - 1) * 3) % ops.length;
                    let distA = (ops.indexOf(a) - idealIndex + ops.length) % ops.length;
                    let distB = (ops.indexOf(b) - idealIndex + ops.length) % ops.length;
                    return distA - distB;
                });
            });

            let matchCarga = {}; 
            let matchOp = {};

            const buscarAumentos = (condicion) => {
                let huboMejora = true;
                while (huboMejora) {
                    huboMejora = false;
                    for (let carga of cargasLibres) {
                        if (matchCarga[carga]) continue; 
                        let visitados = new Set();
                        const dfs = (c) => {
                            for (let op of preferencias[c]) {
                                if (condicion(op, c) && !visitados.has(op)) {
                                    visitados.add(op);
                                    if (!matchOp[op] || dfs(matchOp[op])) {
                                        matchOp[op] = c;
                                        matchCarga[c] = op;
                                        return true;
                                    }
                                }
                            }
                            return false;
                        };
                        if (dfs(carga)) huboMejora = true;
                    }
                }
            };

            buscarAumentos((op, c) => esAptoGlobal(op, c) && !yaLaHizoHoy(op, c, t) && !hizoAyerGlobal(op, c));
            buscarAumentos((op, c) => esAptoGlobal(op, c) && !yaLaHizoHoy(op, c, t) && (!hizoAyerGlobal(op, c) || !sabeVarias(op)));
            buscarAumentos((op, c) => esAptoGlobal(op, c) && (!yaLaHizoHoy(op, c, t) || !sabeVarias(op)));
            buscarAumentos((op, c) => esAptoGlobal(op, c));

            cargasLibres.forEach(carga => {
                let opAsignado = matchCarga[carga];
                if (opAsignado) {
                    matrizResultado[t][carga] = { nombre: opAsignado, alerta: !esAptoGlobal(opAsignado, carga), error: false };
                } else {
                    matrizResultado[t][carga] = { nombre: "No Apto", alerta: false, error: true };
                }
            });
        }
        return matrizResultado;
    }

    function renderizarJornadaHTML(ops, cargas, datosCalculados, contenedor) {
        contenedor.innerHTML = "";
        let horasActivas = horasMañana;
        if (tipoHorarioSeleccionado === "tarde") horasActivas = horasTarde;
        if (tipoHorarioSeleccionado === "noche") horasActivas = horasNoche;

        for (let t = 1; t <= 4; t++) {
            const card = document.createElement("div");
            card.className = "turno-card";
            let html = `<div class="turno-header">TURNO ${t} <span>⏱️ ${horasActivas[t-1]}</span></div><table class="results-table">`;

            let opsAsignadosEnEsteTurno = [];
            let ausentesTurno = bajasPorTurno[t] || [];

            cargas.forEach(carga => {
                let res = datosCalculados[t][carga] || { nombre: "No Apto", alerta: false, error: true };
                if (res.nombre !== "No Apto") opsAsignadosEnEsteTurno.push(res.nombre);

                let hizoEstaCargaAyer = false;
                if (res.nombre !== "No Apto") {
                    let puestosAyer = obtenerPuestoAyer(res.nombre);
                    if (puestosAyer && puestosAyer.has(carga)) hizoEstaCargaAyer = true;
                }

                let claseExtra = hizoEstaCargaAyer ? "op-error" : (res.alerta ? "op-alert" : res.error ? "op-error" : "");
                let cargaEscapada = carga.replace(/'/g, "\\'");

                html += `<tr>
                    <td class="carga-title">${carga}</td>
                    <td>
                        <select class="select-op-editable ${claseExtra}" data-turno="${t}" data-carga="${carga}" onchange="guardarEdicionManualEnMemoria(${t}, '${cargaEscapada}', this.value)">
                            ${ops.map(o => {
                                let puestosAyerOpt = obtenerPuestoAyer(o);
                                let marcaAyer = (puestosAyerOpt && puestosAyerOpt.has(carga)) ? " 🔄 (Ayer)" : "";
                                let marcaBaja = ausentesTurno.includes(o) ? " 🤒 (Baja)" : "";
                                return `<option value="${o}" ${o === res.nombre ? 'selected' : ''}>${o}${marcaAyer}${marcaBaja}</option>`;
                            }).join('')}
                            <option value="No Apto" ${res.nombre === 'No Apto' ? 'selected' : ''}>⚠️ No Apto</option>
                        </select>
                    </td>
                </tr>`;
            });

            html += `</table>`;

            let libres = ops.filter(o => !opsAsignadosEnEsteTurno.includes(o) && !ausentesTurno.includes(o));
            if (libres.length > 0) {
                html += `<div class="turno-libres"><strong>Libres en este turno:</strong> ${libres.join(', ')}</div>`;
            }
            if (ausentesTurno.length > 0) {
                html += `<div class="turno-bajas"><strong>🤒 Baja en este turno:</strong> ${ausentesTurno.join(', ')}</div>`;
            }

            card.innerHTML = html;
            contenedor.appendChild(card);
        }
    }

    function guardarEdicionManualEnMemoria(turnoEditado, cargaEditada, nuevoOperario) {
        cambiosManualesUsuarios[`${turnoEditado}_X_${cargaEditada}`] = nuevoOperario;
        if (nuevoOperario !== "No Apto" && bajasPorTurno[turnoEditado]) {
            bajasPorTurno[turnoEditado] = bajasPorTurno[turnoEditado].filter(o => o !== nuevoOperario);
        }
        generarJornadaCompleta();
    }

    function obtenerPuestoAyer(operario) {
        if (!historialJornadas || historialJornadas.length === 0) return null;
        const jornadaAyer = editandoJornadaId !== null 
            ? historialJornadas.find(j => j.id !== editandoJornadaId) 
            : historialJornadas[0]; 
        if (!jornadaAyer || !jornadaAyer.resumenOps || !jornadaAyer.resumenOps[operario]) return null;

        const puestosAyer = new Set();
        for (let t = 1; t <= 4; t++) {
            let puesto = jornadaAyer.resumenOps[operario][t];
            if (puesto && puesto !== "-") puestosAyer.add(puesto);
        }
        return puestosAyer;
    }

    function guardarEnHistorial() {
        const selectores = document.querySelectorAll(".select-op-editable");
        if(selectores.length === 0) return;

        const ops = leerLista("listaOps");
        const cargas = leerLista("listaCargas");

        // Si estamos editando una jornada existente, restamos primero sus conteos anteriores del contador semanal
        let indiceEditado = -1;
        if (editandoJornadaId !== null) {
            indiceEditado = historialJornadas.findIndex(j => j.id === editandoJornadaId);
            if (indiceEditado !== -1 && historialJornadas[indiceEditado].datos) {
                const datosAnteriores = historialJornadas[indiceEditado].datos;
                for (let t = 1; t <= 4; t++) {
                    if (datosAnteriores[t]) {
                        for (let cargaAnt in datosAnteriores[t]) {
                            let opAnt = datosAnteriores[t][cargaAnt];
                            if (opAnt && opAnt !== "No Apto") {
                                let clvAnt = `${opAnt}_X_${cargaAnt}`;
                                if (conteoSemanal[clvAnt]) {
                                    conteoSemanal[clvAnt] = Math.max(0, conteoSemanal[clvAnt] - 1);
                                }
                            }
                        }
                    }
                }
            }
        }

        // Sumar los conteos de la planificación actual en pantalla
        selectores.forEach(select => {
            let opAsignado = select.value;
            let carga = select.dataset.carga;
            if(opAsignado !== "No Apto") {
                let clv = `${opAsignado}_X_${carga}`;
                if(!conteoSemanal[clv]) conteoSemanal[clv] = 0;
                conteoSemanal[clv]++;
            }
        });
        localStorage.setItem('conteo_semanal_v14', JSON.stringify(conteoSemanal));
        renderizarTablaContadores();

        let copiaTurnos = {};
        let resumenOperariosHoy = {};
        ops.forEach(op => resumenOperariosHoy[op] = { 1: "-", 2: "-", 3: "-", 4: "-" });

        for(let t=1; t<=4; t++) {
            copiaTurnos[t] = {};
            cargas.forEach(carga => {
                let selector = document.querySelector(`select[data-turno="${t}"][data-carga="${carga}"]`);
                if (selector) {
                    let val = selector.value;
                    copiaTurnos[t][carga] = val;
                    if (val !== "No Apto" && resumenOperariosHoy[val]) {
                        resumenOperariosHoy[val][t] = carga;
                    }
                }
            });
        }

        let tipoHorarioTexto = "☀️ Mañana";
        if (tipoHorarioSeleccionado === "tarde") tipoHorarioTexto = "🌙 Tarde";
        if (tipoHorarioSeleccionado === "noche") tipoHorarioTexto = "🌑 Noche";

        if (indiceEditado !== -1) {
            // Actualizar el registro existente en el historial
            historialJornadas[indiceEditado].tipoHorario = tipoHorarioTexto;
            historialJornadas[indiceEditado].datos = copiaTurnos;
            historialJornadas[indiceEditado].resumenOps = resumenOperariosHoy;
            historialJornadas[indiceEditado].editado = true;

            localStorage.setItem('registro_jornadas_v14', JSON.stringify(historialJornadas));

            editandoJornadaId = null;
            plantillaEditada = null;
            turnoRebalanceoMinimo = 5;
            cambiosManualesUsuarios = {};
            bajasPorTurno = { 1: [], 2: [], 3: [], 4: [] };

            mostrarToast("✅ ¡Jornada actualizada con éxito!");
            generarJornadaCompleta();
        } else {
            // Crear nuevo registro del día
            let fechaActual = new Date();
            let nuevaJornada = {
                id: Date.now(),
                fecha: fechaActual.toLocaleDateString("es-ES"),
                hora: fechaActual.toLocaleTimeString("es-ES", {hour: '2-digit', minute:'2-digit'}),
                tipoHorario: tipoHorarioTexto,
                datos: copiaTurnos,
                resumenOps: resumenOperariosHoy
            };

            historialJornadas.unshift(nuevaJornada);
            localStorage.setItem('registro_jornadas_v14', JSON.stringify(historialJornadas));

            bajasPorTurno = { 1: [], 2: [], 3: [], 4: [] };
            cambiosManualesUsuarios = {};

            mostrarToast("💾 ¡Guardado con éxito!");
            generarJornadaCompleta();
        }
    }

        if(historialJornadas.length === 0) {

            htmlContent += `<div class="history-item-content">`;

                    }
                }
                htmlContent += `</div>`;

            htmlContent += `</div>`;

            item.innerHTML = htmlTitle + htmlContent;

        });

    function borrarJornadaIndividual(id) {
        if(confirm("¿Seguro que quieres borrar este registro del historial?")) {
            if (editandoJornadaId === id) {
                cancelarEdicionJornada();
            }
            historialJornadas = historialJornadas.filter(j => j.id !== id);
            localStorage.setItem('registro_jornadas_v14', JSON.stringify(historialJornadas));
            renderizarHistorial();
        }
    }

    function borrarTodoElHistorial() {
        if(confirm("¿Seguro que quieres vaciar todo el historial de jornadas?")) {
            if (editandoJornadaId !== null) {
                cancelarEdicionJornada();
            }
            historialJornadas = [];
            localStorage.removeItem('registro_jornadas_v14');
            renderizarHistorial();
        }

            localStorage.removeItem('conteo_semanal_v14');

        if (!contenedor) return;

            let currentDay = { 1: "-", 2: "-", 3: "-", 4: "-" };

                let estiloExtra = puesto === "🤒 Baja" ? "style='color:#fda4af;'" : "";
                htmlCard += `<div class="tarjeta-resumen-fila">
                        <span class="tarjeta-resumen-turno">T${t}:</span>
                        <span class="${clasePuesto}" ${estiloExtra}>${puesto}</span>
                    </div>`;

                .filter(j => j.id !== editandoJornadaId)
                .slice(0, 3);

                diasPrevios.forEach(jornada => {

                        for (let t = 1; t <= 4; t++) {

            }

            tarjeta.innerHTML = htmlCard;
            contenedor.appendChild(tarjeta);
        });

    function rotarFilaHaciaArriba(inputElement) {
        if (!inputElement.hasAttribute('readonly')) return;
        const filaActual = inputElement.parentElement;
        const contenedor = filaActual.parentElement;
        const filaAnterior = filaActual.previousElementSibling;
        if (filaAnterior) contenedor.insertBefore(filaActual, filaAnterior);
        else contenedor.appendChild(filaActual);
        procesarCambios();
    }

    function exportarJornadaUnicaExcel(id) {
        const jornada = historialJornadas.find(j => j.id === id);
        if(!jornada) return;

        let csvContent = "\uFEFFFecha;Hora;Horario;Operario;Turno 1;Turno 2;Turno 3;Turno 4\n";
        if (jornada.resumenOps) {
            for (let op in jornada.resumenOps) {
                let t1 = jornada.resumenOps[op][1] || "-";
                let t2 = jornada.resumenOps[op][2] || "-";
                let t3 = jornada.resumenOps[op][3] || "-";
                let t4 = jornada.resumenOps[op][4] || "-";
                csvContent += `${jornada.fecha};${jornada.hora};${jornada.tipoHorario};${op};${t1};${t2};${t3};${t4}\n`;
            }
        }

        let nombreArchivo = `Jornada_${jornada.fecha.replace(/\//g, '-')}.csv`;
        compartirTextoNativo(csvContent, nombreArchivo);
    }

    function compartirTextoNativo(texto, nombreArchivo) {
        if (navigator.share) {
            try {
                const file = new File([texto], nombreArchivo, { type: 'text/plain;charset=utf-8' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({ files: [file], title: nombreArchivo, text: 'Reporte de rotaciones.' });
                    return;
                }
            } catch (err) {}
            navigator.share({ title: nombreArchivo, text: texto }).catch(() => copiarAlPortapapeles(texto));
        } else {
            copiarAlPortapapeles(texto);
        }
    }

    function copiarAlPortapapeles(texto) {
        navigator.clipboard.writeText(texto).then(() => alert("📋 Datos copiados al portapapeles."))
        .catch(() => alert("No se ha podido compartir en este dispositivo."));
    }

    function imprimirJornadaPDF(id) {
        const jornada = historialJornadas.find(j => j.id === id);
        if(!jornada) return;

        let textoReporte = `📅 JORNADA ${jornada.fecha} (${jornada.hora}) - ${jornada.tipoHorario}\n\n`;
        for (let t = 1; t <= 4; t++) {
            textoReporte += `--- TURNO ${t} ---\n`;
            if (jornada.datos && jornada.datos[t]) {
                for (let carga in jornada.datos[t]) {
                    textoReporte += `${carga}: ${jornada.datos[t][carga]}\n`;
                }
            }
            textoReporte += `\n`;
        }
        compartirTextoNativo(textoReporte, `Jornada_${jornada.fecha.replace(/\//g,'-')}.txt`);
    }
</script>
